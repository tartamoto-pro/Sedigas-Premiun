<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Arial,Helvetica,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#c62828"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="1.5"/></pattern></defs><rect width="640" height="440" fill="#fff"/><text x="320.0" y="30" font-size="16" text-anchor="middle" font-weight="bold" fill="#1838a8">Inspección periódica: cocina con horno (sección lateral)</text><rect x="20" y="400" width="600" height="14" fill="url(#h)" stroke="#222" stroke-width="2"/><rect x="20" y="20" width="14" height="380" fill="url(#h)" stroke="#222" stroke-width="2"/><rect x="220" y="180" width="220" height="220" fill="#fafafa" stroke="#222" stroke-width="2" /><rect x="240" y="220" width="180" height="150" fill="#ffe0d6" stroke="#222" stroke-width="1.5" /><text x="330" y="300" font-size="14" text-anchor="middle" font-weight="normal" fill="#222">Horno</text><path d="M120 400 L120 320 C120 280 160 270 220 270 C240 270 245 280 240 300 L240 360" fill="none" stroke="#e65100" stroke-width="5"/><text x="450" y="230" font-size="13" text-anchor="start" font-weight="normal" fill="#222">El tubo flexible de</text><text x="450" y="248" font-size="13" text-anchor="start" font-weight="normal" fill="#222">elastómero pasa por</text><text x="450" y="266" font-size="13" text-anchor="start" font-weight="normal" fill="#222">detrás y toca la</text><text x="450" y="284" font-size="13" text-anchor="start" font-weight="normal" fill="#222">pared caliente del horno.</text><text x="450" y="302" font-size="13" text-anchor="start" font-weight="normal" fill="#222">No hay aislamiento.</text></svg>