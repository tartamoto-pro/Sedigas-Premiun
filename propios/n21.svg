<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" font-family="Arial,Helvetica,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#c62828"/></marker><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="1.5"/></pattern></defs><rect width="640" height="440" fill="#fff"/><text x="320.0" y="30" font-size="16" text-anchor="middle" font-weight="bold" fill="#1838a8">Aviso de olor a gas en un sótano</text><rect x="20" y="400" width="600" height="14" fill="url(#h)" stroke="#222" stroke-width="2"/><rect x="140" y="120" width="360" height="280" fill="#eceff1" stroke="#222" stroke-width="2" /><text x="320" y="110" font-size="13" text-anchor="middle" font-weight="normal" fill="#222">Sótano (puerta cerrada)</text><rect x="40" y="200" width="90" height="130" fill="#263238" stroke="#222" stroke-width="2" /><rect x="50" y="214" width="70" height="60" fill="#b2ff59" stroke="#222" stroke-width="1" /><text x="85" y="236" font-size="11" text-anchor="middle" font-weight="bold" fill="#222">O2 20,9 %</text><text x="85" y="256" font-size="11" text-anchor="middle" font-weight="bold" fill="#222">CH4 1,5 %</text><text x="85" y="300" font-size="10" text-anchor="middle" font-weight="normal" fill="#fff">Explosímetro</text><text x="150" y="425" font-size="12" text-anchor="start" font-weight="normal" fill="#222">Medición desde la puerta. El aparato solo muestra % de metano en volumen.</text></svg>